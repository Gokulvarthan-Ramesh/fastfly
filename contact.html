<body>

        <!-- ========== CONTACT SECTION ========== -->
        <section class="section">
            <div class="container">
                <div class="contact-grid-wrapper">
                    <!-- Contact Form -->
                    <div class="contact-form-glass reveal">
                        <div class="form-header">
                            <h3>Send us a Message</h3>
                            <p>We usually respond within 24 hours.</p>
                        </div>
                        <form id="contactForm" action="https://formspree.io/f/mqakezql" method="POST">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Your Name</label>
                                    <input type="text" name="name" placeholder="John Doe" required>
                                </div>
                                <div class="form-group">
                                    <label>Email Address</label>
                                    <input type="email" name="email" placeholder="john@example.com" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Subject</label>
                                <input type="text" name="subject" placeholder="Project Inquiry" required>
                            </div>
                            <div class="form-group">
                                <label>Message</label>
                                <textarea name="message" rows="5" placeholder="Tell us about your project..."
                                    required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary" style="width: 100%; border: none;">Send
                                Message</button>
                        </form>
                    </div>

                    <!-- Contact Info -->
                    <div class="contact-info-list reveal">
                        <div class="contact-info-card">
                            <div class="contact-icon-box"><i class="fas fa-envelope"></i></div>
                            <div>
                                <h4>Email Us</h4>
                                <p>firstflydigitalsolutions@gmail.com</p>
                            </div>
                        </div>
                        <div class="contact-info-card">

                            <div>

                            </div>
                        </div>
                        <div class="contact-info-card">

                            <div>

                                <p>Remote First • Available Worldwide</p>
                            </div>
                        </div>
