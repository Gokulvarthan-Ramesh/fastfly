<section class="cta-split" id="cta">
  <div class="cta-bg"></div>

  <div class="cta-wrapper">

    <!-- LEFT : FORM -->
    <div class="cta-left">
      <span class="cta-eyebrow">Get Started</span>
      <h2>Ready to Take Off?</h2>
      <p>Let’s build something powerful together.</p>

      <form id="ctaForm" class="cta-form" novalidate>
        <div class="form-row">
          <input
            type="text"
            name="name"
            placeholder="Your Name"
            required
          />
          <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
          />
        </div>

        <input
          type="tel"
          name="phone"
          placeholder="Phone Number"
          required
        />

        <textarea
          name="message"
          placeholder="Tell us about your project"
          required
        ></textarea>

        <button type="submit" class="cta-btn">
          Get a Free Quote
        </button>

        <span
          class="form-status"
          id="formStatus"
          aria-live="polite"
        ></span>
      </form>
    </div>

    <!-- RIGHT : VISUAL -->
    <div class="cta-right">
      <div class="cta-image-stack">
        <img src="../assets/images/cta1.jpg" alt="Digital Strategy" />
        <img src="../assets/images/cta2.jpg" alt="Creative Process" />
        <img src="../assets/images/cta3.jpg" alt="Growth and Results" />
      </div>
    </div>

  </div>
</section>
