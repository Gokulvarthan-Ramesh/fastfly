<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Test</title>
    <link rel="stylesheet" href="assets/css/fontawesome-subset.css">
    <link rel="stylesheet" href="assets/css/style.css?v=11">
    <style>
        .test-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 50px;
            text-align: center;
        }
        .icon-box {
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 10px;
        }
        .icon-box i {
            font-size: 2rem;
            display: block;
            margin-bottom: 10px;
            color: #0036cc;
        }
    </style>
</head>
<body>
    <div class="test-grid">
        <div class="icon-box"><i class="fas fa-envelope"></i> Envelope (fas)</div>
        <div class="icon-box"><i class="fas fa-phone-alt"></i> Phone Alt (fas)</div>
        <div class="icon-box"><i class="fas fa-map-marker-alt"></i> Map Marker (fas)</div>
        <div class="icon-box"><i class="fas fa-rocket"></i> Rocket (fas)</div>
        <div class="icon-box"><i class="fas fa-video"></i> Video (fas)</div>
        <div class="icon-box"><i class="fas fa-code"></i> Code (fas)</div>
        <div class="icon-box"><i class="fas fa-handshake"></i> Handshake (fas)</div>
        <div class="icon-box"><i class="fas fa-users"></i> Users (fas)</div>
        <div class="icon-box"><i class="fas fa-quote-right"></i> Quote (fas)</div>
        <div class="icon-box"><i class="fab fa-facebook-f"></i> Facebook (fab)</div>
        <div class="icon-box"><i class="fab fa-instagram"></i> Instagram (fab)</div>
        <div class="icon-box"><i class="fab fa-youtube"></i> Youtube (fab)</div>
        <div class="icon-box"><i class="fas fa-arrow-right"></i> Arrow (fas)</div>
        <div class="icon-box"><i class="fas fa-times"></i> Times (fas)</div>
        <div class="icon-box"><i class="fas fa-check"></i> Check (fas)</div>
        <div class="icon-box"><i class="fas fa-play"></i> Play (fas)</div>
    </div>
</body>
</html>
